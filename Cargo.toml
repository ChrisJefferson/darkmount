[package]
name = "darkmount"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Headless control library and command-line tool for the be quiet! Dark Mount keyboard"
license = "MPL-2.0"
publish = false

[[bin]]
name = "darkmount"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
hidapi = { version = "2.6.7", default-features = false }
